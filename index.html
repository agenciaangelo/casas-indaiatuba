<meta charset="utf-8">

<title>Casa em Indaiatuba · Imóveis</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,sans-serif;background:#10291f;color:#f4f0e8;min-height:100svh;padding:48px 22px}
.wrap{max-width:1000px;margin:0 auto}
small{font-size:.6rem;letter-spacing:.32em;font-weight:600;display:block}
h1{font-family:'Gilda Display',serif;font-weight:400;font-size:1.6rem;letter-spacing:.08em;margin:4px 0 40px}
.grid{display:grid;gap:18px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.wrap{max-width:1300px}.grid{grid-template-columns:1fr 1fr 1fr}}
a{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;color:#fff;text-decoration:none;background:#173a2c}
a img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
a:hover img{transform:scale(1.04)}
a div{position:absolute;inset:auto 0 0 0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
a b{font-family:'Gilda Display',serif;font-weight:400;font-size:1.7rem;display:block}
a span{font-size:.8rem;opacity:.9}
</style>
</head>
<body><div class="wrap">

</div></div></body></html>
